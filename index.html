<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
html,body{margin:0;height:100%;background:#0e1a12;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,-apple-system,sans-serif}
canvas{display:block;touch-action:none;position:fixed;left:0;top:0}
#g{pointer-events:none}
#panel{position:fixed;inset:0;z-index:20;background:rgba(5,12,8,.88);color:#fff;display:none;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
#panel .box{max-width:360px;width:100%}
#panel button{display:block;width:100%;margin:8px 0;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700}
#panel input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:0;font-size:18px;text-align:center}
#panel p{color:#cfe3d6;line-height:1.4}
</style>

<body>
<canvas id="g"></canvas>
<canvas id="c"></canvas>
<div id="panel"><div class="box" id="pbox"></div></div>
<script>
(()=>{
'use strict';
/* =================== SIMULACIÓN (determinista: mismos eventos => mismo partido en todos los teléfonos) =================== */
const FW=105,FH=68,CY=34,PO=4.21,DT=1/60,VP=6.8,VK=5.6,AB=2.6,VMIN=4.6,VMAX=27.6,RST=1.9,RKP=2.4,BLOCK=5,VDIVE=8.5;
const HALF=Math.round((window.__HALF||300)*60),ET=Math.round((window.__ET||120)*60),HOLD=600,MATE=1.5,KWS=14,KWL=24,VLONG=17;   // preparación del pase: corto 0,23 s, largo (≥17 m/s) 0,4 s
//   // 5 min por tiempo, 2 min de alargue, 10 s para pasar; compañeros a la marca + 1,5 m
const WVMAX=120;   // lo más lejos que deja el pellizco (ancho visible en metros) en el celular
const wvMax=()=>WVMAX;   // en pantallas anchas la distancia se calcula como en el celular (ver camUpdate), así que alcanza igual para ver todo
let CFG={bl:5,pm:1,ch:1.1,lvl:1,cam:1,ang:1,wv:0};try{const c=JSON.parse(localStorage.getItem('pt_cfg')||'{}');if(c.bl)CFG.bl=c.bl;if(c.pm)CFG.pm=c.pm;if(c.ch)CFG.ch=c.ch;if(c.lvl>=0&&c.lvl<=2)CFG.lvl=c.lvl|0;if(c.cam>=0&&c.cam<=3)CFG.cam=c.cam|0;if(c.ang===0||c.ang===1)CFG.ang=c.ang;if(c.wv>=16&&c.wv<=WVMAX)CFG.wv=+c.wv;}catch(e){}
const saveCfg=()=>{try{localStorage.setItem('pt_cfg',JSON.stringify(CFG));}catch(e){}};
const sq=Math.sqrt,clamp=(v,a,b)=>v<a?a:v>b?b:v;
const team=i=>i<5?0:1,isK=i=>i%5===0;
const FORM=[[2,34],[18,20],[18,48],[38,26],[38,42]];
function formPos(i,kick){const f=FORM[i%5];let x=f[0];if(kick&&i%5>=3)x=46;return team(i)?[FW-x,f[1]]:[x,f[1]];}
function newState(kt){
  const S={tick:0,p:[],b:{x:FW/2,y:CY,vx:0,vy:0,o:-1,lk:-1,lkT:0,lt:0,kick:null},sc:[0,0],rs:null,kc:0,rsN:0,cfg:{bl:BLOCK,pm:1},ph:'p1',clk:HALF,hT:0,hO:-1,pen:null,end:null,msg:'',msgN:0};
  for(let i=0;i<10;i++){const q=formPos(i,false);S.p.push({x:q[0],y:q[1],path:null,pi:0});}
  kickoffSim(S,kt||0);return S;
}
function kickoffSim(S,kt){
  for(let i=0;i<10;i++){const q=formPos(i,team(i)===kt);const P=S.p[i];P.x=q[0];P.y=q[1];P.path=null;P.pi=0;}
  const k=kt?8:3;S.p[k].x=FW/2-(kt?-1:1)*0.9;S.p[k].y=CY;
  Object.assign(S.b,{x:FW/2,y:CY,vx:0,vy:0,o:k,lk:-1,lkT:0,lt:kt,kick:null});S.rs=null;S.kc++;S.ko={team:kt};S.gk=null;S.hO=-1;
}
function cloneS(S){const P=S.pen;return{tick:S.tick,p:S.p.map(q=>({x:q.x,y:q.y,path:q.path,pi:q.pi})),b:{...S.b,kick:S.b.kick?{...S.b.kick}:null},sc:S.sc.slice(),rs:S.rs?{...S.rs}:null,kc:S.kc,rsN:S.rsN,ko:S.ko?{...S.ko}:null,gk:S.gk?{...S.gk}:null,cfg:{...(S.cfg||{bl:5,pm:1})},
  ph:S.ph,clk:S.clk,hT:S.hT,hO:S.hO,pen:P?{...P,n:P.n.slice(),g:P.g.slice(),log:[P.log[0].slice(),P.log[1].slice()]}:null,end:S.end?{...S.end}:null,msg:S.msg,msgN:S.msgN};}
function say(S,t){S.msg=t;S.msgN++;}
// el pase no sale al instante: el jugador lleva la pierna atrás y le pega (más tiempo si es largo)
function startKick(S,i,a){const b=S.b,tx=+a.tx,ty=+a.ty,pw=clamp(+a.pw||0,0,1);if(!isFinite(tx)||!isFinite(ty))return;
  const dx=tx-b.x,dy=ty-b.y,d=sq(dx*dx+dy*dy);if(d<0.3)return;const v=VMIN+pw*(VMAX*S.cfg.pm-VMIN),lg=v>=VLONG?1:0;
  b.kick={i,vx:dx/d*v,vy:dy/d*v,t:lg?KWL:KWS,T:lg?KWL:KWS,lg};}
function releaseKick(S){const b=S.b,k=b.kick,i=k.i;b.kick=null;b.vx=k.vx;b.vy=k.vy;b.o=-1;b.lk=i;b.lt=team(i);
  if(S.ph==='pen'){b.lkT=9999;S.pen.st='fly';return;}
  b.lkT=24;if(S.ko&&S.ko.team===team(i))S.ko=null;if(S.gk&&S.gk.team===team(i)&&isK(i))S.gk=null;}
function applyAct(S,a){
  if(!a||typeof a!=='object')return;
  if(a.k==='c')return;   // sin ajustes de sensibilidad: todos juegan igual
  if(false){const bl=+a.bl,pm=+a.pm;if(isFinite(bl))S.cfg.bl=clamp(Math.round(bl*2)/2,2,10);if(isFinite(pm))S.cfg.pm=clamp(Math.round(pm*20)/20,0.6,1.4);return;}
  if(a.k==='r'){if(S.ph!=='end')return;const n=newState(0);n.tick=S.tick;n.cfg=S.cfg;n.kc=S.kc+1;n.rsN=S.rsN+1;n.msgN=S.msgN;say(n,'¡Revancha!');for(const k in n)S[k]=n[k];return;}
  if(S.ph==='end')return;
  const i=a.i|0;if(i<0||i>9)return;const b=S.b,P=S.p[i];
  if(S.ph==='pen'){const pe=S.pen;if(pe.st!=='aim')return;
    if(a.k==='d'&&i===pe.dk){const y=+a.y;if(isFinite(y))pe.dive=clamp(y,CY-PO-1,CY+PO+1);}
    else if(a.k==='p'&&i===pe.k&&b.o===i&&!b.kick)startKick(S,i,a);
    return;}
  if(a.k==='s'){P.path=null;P.pi=0;return;}   // frenar: se queda donde está
  if(a.k==='m'){
    if(b.o===i||S.rs)return;
    if(!Array.isArray(a.path)||!a.path.length)return;
    const path=[];for(const q of a.path.slice(0,80)){if(!Array.isArray(q))continue;const x=+q[0],y=+q[1];if(!isFinite(x)||!isFinite(y))continue;path.push([clamp(x,-2,FW+2),clamp(y,-2,FH+2)]);}
    if(path.length){P.path=path;P.pi=0;}
  }else if(a.k==='p'){
    if(b.o!==i||S.rs||b.kick)return;
    startKick(S,i,a);
    // pase a un compañero que corre: se frena donde va a interceptar la pelota
    if(b.kick&&a.rc!==undefined){const r=a.rc|0,rx=+a.rx,ry=+a.ry;if(r>=0&&r<10&&r!==i&&team(r)===team(i)&&isFinite(rx)&&isFinite(ry)){const R2=S.p[r],dx=rx-R2.x,dy=ry-R2.y;
      if(R2.path&&dx*dx+dy*dy<900){R2.path=[[clamp(rx,0,FW),clamp(ry,0,FH)]];R2.pi=0;}}}
  }
}
function inArea(t,x,y){return y>CY-20.16&&y<CY+20.16&&(t?x>FW-16.5:x<16.5);}
// ¿este paso lo lleva a un lugar prohibido? (cerca del que tiene la pelota, cruzar la mitad en el saque, entrar al área en el saque de arco)
function blocked(S,i,x,y){
  const b=S.b,t=team(i);
  if(b.o>=0&&b.o!==i&&!(isK(i)&&team(b.o)!==t)){const c=S.p[b.o],dx=x-c.x,dy=y-c.y,P=S.p[i],ox=P.x-c.x,oy=P.y-c.y;const R=team(b.o)===t?S.cfg.bl+MATE:S.cfg.bl;if(dx*dx+dy*dy<R*R&&dx*dx+dy*dy<ox*ox+oy*oy)return true;}
  if(S.ko&&S.ko.team!==t){if(t===0?x>FW/2-0.5:x<FW/2+0.5)return true;}
  if(S.gk&&S.gk.team!==t&&inArea(S.gk.team,x,y)&&!inArea(S.gk.team,S.p[i].x,S.p[i].y))return true;
  return false;
}
function keeperBox(i){return team(i)?[FW-16.5,FW]:[0,16.5];}
function stepSim(S){
  const b=S.b;
  if(S.ph==='end'){S.tick++;return;}
  if(S.ph==='pen'){penStep(S);S.tick++;return;}
  if(S.rs){S.rs.t--;if(S.rs.t<=0)restartSim(S);}
  else if(--S.clk<=0){periodEnd(S);S.tick++;return;}
  for(let i=0;i<10;i++){const P=S.p[i];if(!P.path||b.o===i)continue;
    const t=P.path[P.pi],dx=t[0]-P.x,dy=t[1]-P.y,d=sq(dx*dx+dy*dy),st=(isK(i)?VK:VP)*DT;
    let nx,ny,reached=false;if(d<=st){nx=t[0];ny=t[1];reached=true;}else{nx=P.x+dx/d*st;ny=P.y+dy/d*st;}
    if(blocked(S,i,nx,ny)){P.path=null;P.pi=0;continue;}
    P.x=nx;P.y=ny;if(reached){P.pi++;if(P.pi>=P.path.length){P.path=null;P.pi=0;}}
    if(isK(i)){const kb=keeperBox(i);if(P.x<kb[0]||P.x>kb[1]||P.y<CY-20.16||P.y>CY+20.16){P.x=clamp(P.x,kb[0],kb[1]);P.y=clamp(P.y,CY-20.16,CY+20.16);}}
    P.x=clamp(P.x,-3,FW+3);P.y=clamp(P.y,-3,FH+3);}
  if(b.o>=0){const c=S.p[b.o];
    for(let j=0;j<10;j++){const same=team(j)===team(b.o);if(j===b.o||isK(j)&&!same)continue;const P=S.p[j],dx=P.x-c.x,dy=P.y-c.y,d=sq(dx*dx+dy*dy),R=same?S.cfg.bl+MATE:S.cfg.bl;
      if(d<R){const m=Math.min(R-d,VP*DT);if(d<1e-6){P.x+=team(j)?m:-m;}else{P.x+=dx/d*m;P.y+=dy/d*m;}if(P.path&&blocked(S,j,P.path[P.pi][0],P.path[P.pi][1])){P.path=null;P.pi=0;}}}
    b.x=c.x;b.y=c.y;b.vx=0;b.vy=0;
    if(b.kick&&b.kick.i!==b.o)b.kick=null;
    if(b.kick){if(--b.kick.t<=0)releaseKick(S);}
    else{
    // el arquero rival sí puede acercarse: si toca la pelota, se la saca
    if(!S.rs){const k=(1-team(b.o))*5,K=S.p[k],kx=K.x-c.x,ky=K.y-c.y;if(kx*kx+ky*ky<RST*RST){b.o=k;b.lt=team(k);b.lk=-1;b.lkT=0;S.ko=null;S.gk=null;K.path=null;K.pi=0;}}
    // 10 segundos para pasarla: si no, lateral para el rival a la altura de la pelota
    if(S.hO!==b.o){S.hO=b.o;S.hT=0;}else if(!S.rs&&++S.hT>=HOLD){const t=team(b.o);S.rs={type:'lateral',team:1-t,x:clamp(b.x,0.5,FW-0.5),y:b.y<CY?0.5:FH-0.5,t:45,why:'6s'};b.o=-1;b.lt=t;S.rsN++;S.hO=-1;S.hT=0;}}}
  else if(!S.rs){S.hO=-1;
    const s=sq(b.vx*b.vx+b.vy*b.vy);if(s>0){const ns=s-AB*DT;if(ns<=0){b.vx=0;b.vy=0;}else{b.vx*=ns/s;b.vy*=ns/s;}}
    b.x+=b.vx*DT;b.y+=b.vy*DT;if(b.lkT>0)b.lkT--;
    if(b.x<0||b.x>FW){
      if(b.y>CY-PO&&b.y<CY+PO){const t=b.x>FW?0:1;S.sc[t]++;S.rs={type:'goal',team:1-t,t:110,sc:t};b.vx=0;b.vy=0;S.rsN++;}
      else{const s2=b.x<0?0:1,def=s2;if(b.lt===def)S.rs={type:'corner',team:1-def,x:s2?FW-0.5:0.5,y:b.y<CY?0.5:FH-0.5,t:50};
        else S.rs={type:'arco',team:def,x:s2?FW-5.5:5.5,y:CY+(b.y<CY?-4:4),t:50};b.vx=0;b.vy=0;S.rsN++;}
    }else if(b.y<0||b.y>FH){S.rs={type:'lateral',team:1-b.lt,x:clamp(b.x,0.5,FW-0.5),y:b.y<0?0.5:FH-0.5,t:45};b.vx=0;b.vy=0;S.rsN++;}
    if(!S.rs){let best=-1,bd=1e9;
      for(let i=0;i<10;i++){if(i===b.lk&&b.lkT>0)continue;const P=S.p[i],dx=P.x-b.x,dy=P.y-b.y,d=sq(dx*dx+dy*dy);
        let r=RST;if(isK(i)){const kb=keeperBox(i);if(b.x>=kb[0]-0.5&&b.x<=kb[1]+0.5)r=RKP;}
        if(d<r&&d<bd){bd=d;best=i;}}
      if(best>=0){S.ko=null;if(S.gk&&!(isK(best)&&team(best)===S.gk.team))S.gk=null;b.o=best;b.vx=0;b.vy=0;b.lk=-1;b.lkT=0;b.lt=team(best);S.p[best].path=null;S.p[best].pi=0;}}
  }
  S.tick++;
}
function restartSim(S){
  const r=S.rs;S.rs=null;const b=S.b;
  if(r.type==='goal'||r.type==='half'){kickoffSim(S,r.team);return;}
  let tk=-1;
  if(r.type==='arco'){tk=r.team?5:0;S.gk={team:r.team};
    for(let j=0;j<10;j++){if(team(j)===r.team)continue;const q=S.p[j];if(inArea(r.team,q.x,q.y)){q.path=null;q.pi=0;const ex=r.team?FW-17:17;const dx=Math.abs(q.x-(r.team?FW-16.5:16.5)),dy=Math.min(Math.abs(q.y-(CY-20.16)),Math.abs(q.y-(CY+20.16)));if(dx<dy)q.x=ex;else q.y=q.y<CY?CY-20.7:CY+20.7;}}}
  else{let bd=1e9;for(let i=0;i<10;i++){if(team(i)!==r.team||isK(i))continue;const P=S.p[i],dx=P.x-r.x,dy=P.y-r.y,d=dx*dx+dy*dy;if(d<bd){bd=d;tk=i;}}}
  if(r.type!=='arco')S.gk=null;S.ko=null;
  S.hO=-1;const P=S.p[tk];P.x=r.x;P.y=r.y;P.path=null;P.pi=0;
  Object.assign(b,{x:r.x,y:r.y,vx:0,vy:0,o:tk,lk:-1,lkT:0,lt:r.team,kick:null});
}
/* ---- tiempos, alargue y penales ---- */
function stopAll(S){const b=S.b;b.vx=0;b.vy=0;b.o=-1;b.kick=null;for(const q of S.p){q.path=null;q.pi=0;}}
function endGame(S,w){stopAll(S);S.ph='end';S.end={w};S.rs=null;S.ko=null;S.gk=null;say(S,'¡Final del partido!');}
function periodEnd(S){
  const tie=S.sc[0]===S.sc[1];stopAll(S);S.ko=null;S.gk=null;
  if(S.ph==='p1'){S.ph='p2';S.clk=HALF;S.rs={type:'half',team:1,t:150};say(S,'Fin del primer tiempo');}
  else if(S.ph==='p2'&&tie){S.ph='et';S.clk=ET;S.rs={type:'half',team:0,t:150};say(S,'¡Empate! 2 minutos de alargue');}
  else if(!tie)endGame(S,S.sc[0]>S.sc[1]?0:1);
  else{S.ph='pen';S.pen={kt:0,n:[0,0],g:[0,0],log:[[],[]],st:'aim',t:0,dive:null,k:-1,dk:-1};penSetup(S);say(S,'¡Penales!');}
  S.rsN++;
}
const PEN_ORD=[3,4,1,2,0];
function penSetup(S){
  const pe=S.pen,kt=pe.kt,dir=kt?-1:1,gx=kt?0:FW,b=S.b;stopAll(S);
  pe.k=kt*5+PEN_ORD[pe.n[kt]%5];pe.dk=(1-kt)*5;pe.dive=null;pe.st='aim';pe.t=HOLD;
  let r=0;for(let i=0;i<10;i++){if(i===pe.k||i===pe.dk)continue;const q=S.p[i];q.x=FW/2-dir*(4+(r%2)*3);q.y=CY-15+(r>>1)*3.4+(r%2)*1.7;r++;}
  const K=S.p[pe.k],D=S.p[pe.dk];K.x=gx-dir*11;K.y=CY;D.x=gx-dir*0.6;D.y=CY;
  Object.assign(b,{x:K.x,y:CY,vx:0,vy:0,o:pe.k,lk:-1,lkT:0,lt:kt,kick:null});S.rs=null;S.ko=null;S.gk=null;S.rsN++;
}
function penResult(S,goal,txt){const pe=S.pen,kt=pe.kt;pe.g[kt]+=goal?1:0;pe.log[kt].push(goal?1:0);pe.n[kt]++;pe.st='res';pe.t=110;pe.last=goal?1:0;S.b.vx=0;S.b.vy=0;say(S,goal?'¡GOL!':txt);}
function penDone(pe){const [n0,n1]=pe.n,[g0,g1]=pe.g;
  if(n0<=5&&n1<=5&&(g0+(5-n0)<g1||g1+(5-n1)<g0))return true;
  return n0===n1&&n0>=5&&g0!==g1;}
function penStep(S){
  const pe=S.pen,b=S.b;
  if(pe.st==='aim'){if(b.kick){if(--b.kick.t<=0)releaseKick(S);return;}if(--pe.t<=0)penResult(S,false,'¡Se le pasaron los 10 segundos!');return;}
  if(pe.st==='res'){if(--pe.t<=0){if(penDone(pe))endGame(S,pe.g[0]>pe.g[1]?0:1);else{pe.kt=1-pe.kt;penSetup(S);}}return;}
  // la pelota va al arco y el arquero se tira adonde eligió
  const D=S.p[pe.dk];if(pe.dive!==null){const dy=pe.dive-D.y,st=VDIVE*DT;D.y+=Math.abs(dy)<=st?dy:(dy>0?st:-st);}
  const s=sq(b.vx*b.vx+b.vy*b.vy);if(s>0){const ns=s-AB*DT;if(ns<=0){b.vx=0;b.vy=0;}else{b.vx*=ns/s;b.vy*=ns/s;}}
  b.x+=b.vx*DT;b.y+=b.vy*DT;
  const dx=D.x-b.x,dy=D.y-b.y,rr=pe.dive===null?1.2:2;if(dx*dx+dy*dy<rr*rr){penResult(S,false,'¡Atajó el arquero!');return;}
  if(pe.kt?b.x<0:b.x>FW){if(b.y>CY-PO&&b.y<CY+PO)penResult(S,true);else penResult(S,false,'¡Afuera!');return;}
  if(b.y<0||b.y>FH||b.vx===0&&b.vy===0)penResult(S,false,'¡No llegó al arco!');
}
/* =================== IA (rival de la PC, o equipo sin humanos en el online) =================== */
// niveles: cada cuánto piensa, cuánto retiene, cuánto se equivoca, desde dónde patea, si presiona y cómo cubre los pases
const AIL=[{int:36,hold:[100,250],noise:5,err:1.3,shoot:24,press:false,lane:0},
           {int:22,hold:[60,160],noise:2,err:0.5,shoot:31,press:true,lane:1},
           {int:12,hold:[30,95],noise:0.5,err:0.12,shoot:36,press:true,lane:2}];
const aiPlan={};
function aiThink(S,t,lvl){
  const L=AIL[clamp((lvl===undefined?CFG.lvl:lvl)|0,0,2)],acts=[],b=S.b,dir=t?-1:1,gx=t?0:FW,ogx=t?FW:0,mine=[],opp=[],rnd=Math.random;
  for(let i=0;i<10;i++)(team(i)===t?mine:opp).push(i);
  const P=S.p,dist=(a,b2)=>sq((a.x-b2.x)**2+(a.y-b2.y)**2);
  const goTo=(i,x,y)=>{x=clamp(x,1,FW-1);y=clamp(y,1,FH-1);const q=P[i],end=q.path?q.path[q.path.length-1]:[q.x,q.y];
    if(sq((end[0]-x)**2+(end[1]-y)**2)>1.6&&sq((q.x-x)**2+(q.y-y)**2)>0.8)acts.push({k:'m',i,path:[[x,y]]});};

    const ux=c.x-a.x,uy=c.y-a.y,l2=ux*ux+uy*uy||1,t=clamp(((sx-a.x)*ux+(sy-a.y)*uy)/l2,0,1),d=Math.hypot(sx-a.x-ux*t,sy-a.y-uy*t);if(d<Math.max(46,m*2.4)&&d<bd){bd=d;best=i;}}
  else{const s=toS(q.x,q.y),d=Math.hypot(s.x-sx,s.y-sy);if(d<Math.max(40,PR()*3)&&d<bd){bd=d;best=i;}}}return best;}
const PTR=new Map();let pinch=null,pan=null;
// el dedo apoya sobre el cuerpo, no en los pies: la diferencia se va absorbiendo en los primeros 5 m, así la línea nunca arranca para atrás
function dragTarget(d,x,y){const f=toF(x,y),dm=Math.hypot(f.x-d.f0.x,f.y-d.f0.y),k=clamp(dm/5,0,1);return[clamp(f.x+d.off[0]*(1-k),0.3,FW-0.3),clamp(f.y+d.off[1]*(1-k),0.3,FH-0.3)];}
// recorrido final: suaviza zigzags chicos y saca puntos muy juntos
function smoothPath(d){let p=d.pts.slice();if(d.last){const l=p[p.length-1];if(Math.hypot(d.last[0]-l[0],d.last[1]-l[1])>0.4)p.push(d.last);}
  for(let r=0;r<2;r++){const q=p.map(a=>a.slice());for(let k=1;k<p.length-1;k++){q[k][0]=p[k-1][0]*.25+p[k][0]*.5+p[k+1][0]*.25;q[k][1]=p[k-1][1]*.25+p[k][1]*.5+p[k+1][1]*.25;}p=q;}
  const o=[];let l=p[0];for(let k=1;k<p.length;k++){const a=p[k];if(Math.hypot(a[0]-l[0],a[1]-l[1])>=1.0||k===p.length-1){o.push([Math.round(a[0]*10)/10,Math.round(a[1]*10)/10]);l=a;}}
  if(o.length>1&&Math.hypot(o[0][0]-d.pts[0][0],o[0][1]-d.pts[0][1])<0.8)o.shift();return o;}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();const x=e.clientX,y=e.clientY;try{cv.setPointerCapture(e.pointerId);}catch(_){}
  PTR.set(e.pointerId,{x,y});
  if(PTR.size>=2){   // segundo dedo: zoom; se cancela lo que hacía el primero
    if(is3D()&&!pinch){const [a,c]=[...PTR.values()];pinch={d0:Math.hypot(a.x-c.x,a.y-c.y)||1,w0:CFG.wv||CAMW[clamp(CFG.cam|0,0,2)]};drag=null;hold=null;tap=null;pan=null;ballTap=null;}
    return;}
  if(pinch)return;
  for(const bt of buttons())if(x>bt.x&&x<bt.x+bt.w&&y>bt.y&&y<bt.y+bt.h){if(bt.id==='on')panel();else if(bt.id==='cf')settings();else if(bt.id==='re')menu();else if(bt.id==='fs')toggleFS();else if(bt.id==='ctr')CAM.free=false;else if(bt.id==='cam'){CFG.cam=gl?(CFG.cam+1)%4:3;CFG.wv=0;saveCfg();show3D();CAM.init=false;banner(['Cámara cerca','Cámara media','Cámara lejos','Vista mapa'][CFG.cam],800);}return;}
  if(G.mode==='online'&&!NET.host&&!NET.synced)return;

    if(team(pe.dk)===G.myTeam){const f=toF(x,y),yy=Math.round(clamp(f.y,CY-PO-1,CY+PO+1)*10)/10;G.myDive=yy;act({k:'d',i:pe.dk,y:yy});snd(600,500,0.05,0.06);return;}
    if(i!==pe.k)return;}
  if(nearBall(x,y))ballTap={id:e.pointerId,x,y};
  if(i<0){if(is3D())pan={id:e.pointerId,x,y,moved:false};return;}   // en el pasto: mover la cámara
  if(b.o===i){if(!b.kick)hold={id:e.pointerId,i,s0:[x,y],live:false,f:null};return;}   // pase: arrastrar desde el que tiene la pelota
  {const f0=toF(x,y);drag={id:e.pointerId,i,pts:[[S.p[i].x,S.p[i].y]],f0,s0:[x,y],live:false,off:[S.p[i].x-f0.x,S.p[i].y-f0.y],sm:null};}
});
cv.addEventListener('pointermove',e=>{
  const x=e.clientX,y=e.clientY;

  if(pan&&e.pointerId===pan.id){if(!pan.moved&&Math.hypot(x-pan.x,y-pan.y)<7)return;pan.moved=true;
    const a=toF3(pan.x,pan.y),c=toF3(x,y);CAM.tx=clamp(CAM.tx+a.x-c.x,-4,FW+4);CAM.ty=clamp(CAM.ty+a.y-c.y,-4,FH+4);CAM.free=true;camUpdate(0,false);pan.x=x;pan.y=y;return;}
  if(drag&&e.pointerId===drag.id){

    const t=dragTarget(drag,x,y);drag.sm=drag.sm?[drag.sm[0]+(t[0]-drag.sm[0])*.55,drag.sm[1]+(t[1]-drag.sm[1])*.55]:t;drag.last=t;
    const l=drag.pts[drag.pts.length-1];if(Math.hypot(drag.sm[0]-l[0],drag.sm[1]-l[1])>1.2)drag.pts.push([Math.round(drag.sm[0]*10)/10,Math.round(drag.sm[1]*10)/10]);}
  if(hold&&e.pointerId===hold.id){if(!hold.live&&Math.hypot(x-hold.s0[0],y-hold.s0[1])<12)return;hold.live=true;hold.f=toF(x,y);hold.sx=x;hold.sy=y;
    const now=performance.now(),charging=hold.st&&now-hold.st>=STILL;
    if(!hold.sp||Math.hypot(x-hold.sp[0],y-hold.sp[1])>(charging?KEEP:6)){hold.sp=[x,y];hold.st=now;}}   // se mueve: deja de cargar; frena: empieza   // moverlo bastante vuelve a empezar; un temblor no
});
function up(e){
  if(ballTap&&e.pointerId===ballTap.id){const bt=ballTap;ballTap=null;
    if(e.type==='pointerup'&&Math.hypot(e.clientX-bt.x,e.clientY-bt.y)<14&&!(drag&&drag.id===e.pointerId&&drag.pts.length>1)){
      if(drag&&drag.id===e.pointerId)drag=null;if(pan&&pan.id===e.pointerId)pan=null;PTR.delete(e.pointerId);chaseBall();return;}}
  PTR.delete(e.pointerId);
  if(pinch){if(PTR.size===0){pinch=null;saveCfg();}return;}
  if(pan&&e.pointerId===pan.id){pan=null;return;}
  if(drag&&e.pointerId===drag.id){const d=drag;drag=null;if(d.live&&d.pts.length>1&&e.type==='pointerup'){const ps=smoothPath(d);if(ps.length)act({k:'m',i:d.i,path:ps.slice(0,60)});}
    else if(e.type==='pointerup'&&G.S.p[d.i].path){act({k:'s',i:d.i});snd(400,300,0.05,0.05);}}
  if(tap&&e.pointerId===tap.id){const t=tap;tap=null;if(Math.hypot(e.clientX-t.x,e.clientY-t.y)<14){passMode=t.cancel?false:true;if(passMode)snd(600,800,0.05,0.06);}}
  if(hold&&e.pointerId===hold.id){const h=hold;hold=null;if(e.type==='pointerup'){const b=G.S.b,now=performance.now(),r=aimPass(h,now);
      if(!r.cancel&&b.o===h.i){const a={k:'p',i:b.o,tx:Math.round(r.tx*10)/10,ty:Math.round(r.ty*10)/10,pw:r.pw};if(r.mate>=0&&G.S.p[r.mate].path){a.rc=r.mate;a.rx=a.tx;a.ry=a.ty;}act(a);snd(140,60,0.3+r.pw*0.4,0.12);}}}
}

  if(!(G.mode==='online'&&!NET.host&&!NET.synced)&&!window.__FREEZE){
    const T=targetTick();if(T>G.S.tick+300)G.S.tick=T-1;advanceTo(T);
    // IA: equipos sin humanos (en el anfitrión o contra la PC)
    if((G.mode==='pc'||NET.host)&&(G.S.tick-G.lastAI>=AIL[CFG.lvl].int||G.S.tick<G.lastAI)){G.lastAI=G.S.tick;for(const t of [0,1])if(!G.human[t])for(const a of aiThink(G.S,t))act(a);}
  }
  netTick();
  // efectos según cambios del partido
  const S=G.S,sc=S.sc.join('-');
  if(sc!==G.lastSc){const [a,c]=G.lastSc.split('-').map(Number);if(S.sc[0]>a||S.sc[1]>c){const t=S.sc[0]>a?0:1;banner(t===G.myTeam?'¡GOOOL!':'Gol rival',1900,true);snd(500,900,0.15,0.6,'sawtooth');}G.lastSc=sc;}
  if(S.rsN!==G.lastRsN){G.lastRsN=S.rsN;if(S.rs&&S.rs.type!=='goal'&&S.rs.type!=='half'){banner(S.rs.why==='6s'?'¡10 segundos! Lateral '+(S.rs.team===G.myTeam?'tuyo':'del rival'):{lateral:'Lateral',corner:'¡Córner!',arco:'Saque de arco'}[S.rs.type],1500);snd(2900,2700,0.05,0.2,'square');}}
  if(S.msgN!==G.lastMsgN){G.lastMsgN=S.msgN;if(/GOL|tiempo|Alargue|Penales|Revancha/.test(S.msg||''))CAM.free=false;if(S.msg){const big=/GOL|Final|Penales|Revancha/.test(S.msg);banner(S.msg,1900,big);if(S.msg==='¡GOL!')snd(500,900,0.15,0.6,'sawtooth');else snd(2900,2400,0.06,0.35,'square');}}
  if(S.ph==='pen'){const k=S.pen.n[0]+S.pen.n[1];if(G.diveFor!==k){G.diveFor=k;G.myDive=null;}}
  if(S.ph==='end'&&!G.endShown){G.endShown=true;passMode=false;hold=null;drag=null;setTimeout(()=>{if(G.S.ph==='end')endPanel();},1200);}
  if(S.ph!=='end'&&G.endShown){G.endShown=false;if(G.panelKind==='end')pel.style.display='none';}
  if(passMode&&!(S.b.o>=0&&team(S.b.o)===G.myTeam))passMode=false;
  if(drag&&S.b.o===drag.i)drag=null;
  draw(now);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
menu();
setTimeout(()=>{if(!window.claude&&(location.hash||'').length>2)panel();},900);
window.__T={aimPass,mine,assignOwners,VS,BV,CAM,MESH,blocked,advanceTo,aiThink,G,NET,act,newGame,toS,toF,joined,netConnect,netJoin,panel,lobbyRooms,menu,CFG,stepSim,applyAct,newState,cloneS};
})();
