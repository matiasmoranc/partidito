<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Partidito</title>
<style>
html,body{margin:0;height:100%;background:#0e1a12;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,-apple-system,sans-serif}
canvas{display:block;touch-action:none;position:fixed;left:0;top:0}
#panel{position:fixed;inset:0;z-index:20;background:rgba(5,12,8,.88);color:#fff;display:none;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
#panel .box{max-width:360px;width:100%}
#panel button{display:block;width:100%;margin:8px 0;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700}
#panel input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:0;font-size:18px;text-align:center}
#panel p{color:#cfe3d6;line-height:1.4}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel"><div class="box" id="pbox"></div></div>
<script>
(()=>{
'use strict';
/* =================== SIMULACIÓN (determinista: mismos eventos => mismo partido en todos los teléfonos) =================== */
const FW=105,FH=68,CY=34,PO=3.66,DT=1/60,VP=6.8,VK=5.6,AB=2.6,VMIN=4.6,VMAX=27.6,RST=1.9,RKP=2.4,BLOCK=5;
let CFG={bl:5,pm:1,ch:1.1};try{const c=JSON.parse(localStorage.getItem('pt_cfg')||'{}');if(c.bl)CFG.bl=c.bl;if(c.pm)CFG.pm=c.pm;if(c.ch)CFG.ch=c.ch;}catch(e){}
const sq=Math.sqrt,clamp=(v,a,b)=>v<a?a:v>b?b:v;
const team=i=>i<5?0:1,isK=i=>i%5===0;
const FORM=[[2,34],[18,20],[18,48],[38,26],[38,42]];
function formPos(i,kick){const f=FORM[i%5];let x=f[0];if(kick&&i%5>=3)x=46;return team(i)?[FW-x,f[1]]:[x,f[1]];}
function newState(kt){
  const S={tick:0,p:[],b:{x:FW/2,y:CY,vx:0,vy:0,o:-1,lk:-1,lkT:0,lt:0},sc:[0,0],rs:null,kc:0,rsN:0,cfg:{bl:CFG.bl,pm:CFG.pm}};
  for(let i=0;i<10;i++){const q=formPos(i,false);S.p.push({x:q[0],y:q[1],path:null,pi:0});}
  kickoffSim(S,kt||0);return S;
}
function kickoffSim(S,kt){
  for(let i=0;i<10;i++){const q=formPos(i,team(i)===kt);const P=S.p[i];P.x=q[0];P.y=q[1];P.path=null;P.pi=0;}
  const k=kt?8:3;S.p[k].x=FW/2-(kt?-1:1)*0.9;S.p[k].y=CY;
  Object.assign(S.b,{x:FW/2,y:CY,vx:0,vy:0,o:k,lk:-1,lkT:0,lt:kt});S.rs=null;S.kc++;S.ko={team:kt};S.gk=null;
}
function cloneS(S){return{tick:S.tick,p:S.p.map(q=>({x:q.x,y:q.y,path:q.path,pi:q.pi})),b:{...S.b},sc:S.sc.slice(),rs:S.rs?{...S.rs}:null,kc:S.kc,rsN:S.rsN,ko:S.ko?{...S.ko}:null,gk:S.gk?{...S.gk}:null,cfg:{...(S.cfg||{bl:5,pm:1})}};}
function applyAct(S,a){
  if(!a||typeof a!=='object')return;
  if(a.k==='c'){const bl=+a.bl,pm=+a.pm;if(isFinite(bl))S.cfg.bl=clamp(Math.round(bl*2)/2,2,10);if(isFinite(pm))S.cfg.pm=clamp(Math.round(pm*20)/20,0.6,1.4);return;}
  const i=a.i|0;if(i<0||i>9)return;const b=S.b,P=S.p[i];
  if(a.k==='m'){
    if(b.o===i||S.rs)return;
    if(!Array.isArray(a.path)||!a.path.length)return;
    const path=[];for(const q of a.path.slice(0,80)){if(!Array.isArray(q))continue;const x=+q[0],y=+q[1];if(!isFinite(x)||!isFinite(y))continue;path.push([clamp(x,-2,FW+2),clamp(y,-2,FH+2)]);}
    if(path.length){P.path=path;P.pi=0;}
  }else if(a.k==='p'){
    if(b.o!==i||S.rs)return;
    const tx=+a.tx,ty=+a.ty,pw=clamp(+a.pw||0,0,1);if(!isFinite(tx)||!isFinite(ty))return;
    const dx=tx-b.x,dy=ty-b.y,d=sq(dx*dx+dy*dy);if(d<0.3)return;
    const v=VMIN+pw*(VMAX*S.cfg.pm-VMIN);b.vx=dx/d*v;b.vy=dy/d*v;b.o=-1;b.lk=i;b.lkT=24;b.lt=team(i);
    if(S.ko&&S.ko.team===team(i))S.ko=null;if(S.gk&&S.gk.team===team(i)&&isK(i))S.gk=null;
  }
}
function inArea(t,x,y){return y>CY-20.16&&y<CY+20.16&&(t?x>FW-16.5:x<16.5);}
// ¿este paso lo lleva a un lugar prohibido? (cerca del que tiene la pelota, cruzar la mitad en el saque, entrar al área en el saque de arco)
function blocked(S,i,x,y){
  const b=S.b,t=team(i);
  if(b.o>=0&&team(b.o)!==t){const c=S.p[b.o],dx=x-c.x,dy=y-c.y,P=S.p[i],ox=P.x-c.x,oy=P.y-c.y;const R=S.cfg.bl;if(dx*dx+dy*dy<R*R&&dx*dx+dy*dy<ox*ox+oy*oy)return true;}
  if(S.ko&&S.ko.team!==t){if(t===0?x>FW/2-0.5:x<FW/2+0.5)return true;}
  if(S.gk&&S.gk.team!==t&&inArea(S.gk.team,x,y)&&!inArea(S.gk.team,S.p[i].x,S.p[i].y))return true;
  return false;
}
function keeperBox(i){return team(i)?[FW-16.5,FW]:[0,16.5];}
function stepSim(S){
  const b=S.b;
  if(S.rs){S.rs.t--;if(S.rs.t<=0)restartSim(S);}
  for(let i=0;i<10;i++){const P=S.p[i];if(!P.path||b.o===i)continue;
    const t=P.path[P.pi],dx=t[0]-P.x,dy=t[1]-P.y,d=sq(dx*dx+dy*dy),st=(isK(i)?VK:VP)*DT;
    let nx,ny,reached=false;if(d<=st){nx=t[0];ny=t[1];reached=true;}else{nx=P.x+dx/d*st;ny=P.y+dy/d*st;}
    if(blocked(S,i,nx,ny)){P.path=null;P.pi=0;continue;}
    P.x=nx;P.y=ny;if(reached){P.pi++;if(P.pi>=P.path.length){P.path=null;P.pi=0;}}
    if(isK(i)){const kb=keeperBox(i);if(P.x<kb[0]||P.x>kb[1]||P.y<CY-20.16||P.y>CY+20.16){P.x=clamp(P.x,kb[0],kb[1]);P.y=clamp(P.y,CY-20.16,CY+20.16);}}
    P.x=clamp(P.x,-3,FW+3);P.y=clamp(P.y,-3,FH+3);}
  if(b.o>=0){const c=S.p[b.o];
    for(let j=0;j<10;j++){if(team(j)===team(b.o))continue;const P=S.p[j],dx=P.x-c.x,dy=P.y-c.y,d=sq(dx*dx+dy*dy);
      if(d<S.cfg.bl){const m=Math.min(S.cfg.bl-d,VP*DT);if(d<1e-6){P.x+=team(j)?m:-m;}else{P.x+=dx/d*m;P.y+=dy/d*m;}if(P.path&&blocked(S,j,P.path[P.pi][0],P.path[P.pi][1])){P.path=null;P.pi=0;}}}
    b.x=c.x;b.y=c.y;b.vx=0;b.vy=0;}
  else if(!S.rs){
    const s=sq(b.vx*b.vx+b.vy*b.vy);if(s>0){const ns=s-AB*DT;if(ns<=0){b.vx=0;b.vy=0;}else{b.vx*=ns/s;b.vy*=ns/s;}}
    b.x+=b.vx*DT;b.y+=b.vy*DT;if(b.lkT>0)b.lkT--;
    if(b.x<0||b.x>FW){
      if(b.y>CY-PO&&b.y<CY+PO){const t=b.x>FW?0:1;S.sc[t]++;S.rs={type:'goal',team:1-t,t:110,sc:t};b.vx=0;b.vy=0;S.rsN++;}
      else{const s2=b.x<0?0:1,def=s2;if(b.lt===def)S.rs={type:'corner',team:1-def,x:s2?FW-0.5:0.5,y:b.y<CY?0.5:FH-0.5,t:50};
        else S.rs={type:'arco',team:def,x:s2?FW-5.5:5.5,y:CY+(b.y<CY?-4:4),t:50};b.vx=0;b.vy=0;S.rsN++;}
    }else if(b.y<0||b.y>FH){S.rs={type:'lateral',team:1-b.lt,x:clamp(b.x,0.5,FW-0.5),y:b.y<0?0.5:FH-0.5,t:45};b.vx=0;b.vy=0;S.rsN++;}
    if(!S.rs){let best=-1,bd=1e9;
      for(let i=0;i<10;i++){if(i===b.lk&&b.lkT>0)continue;const P=S.p[i],dx=P.x-b.x,dy=P.y-b.y,d=sq(dx*dx+dy*dy);
        let r=RST;if(isK(i)){const kb=keeperBox(i);if(b.x>=kb[0]-0.5&&b.x<=kb[1]+0.5)r=RKP;}
        if(d<r&&d<bd){bd=d;best=i;}}
      if(best>=0){S.ko=null;if(S.gk&&!(isK(best)&&team(best)===S.gk.team))S.gk=null;b.o=best;b.vx=0;b.vy=0;b.lk=-1;b.lkT=0;b.lt=team(best);S.p[best].path=null;S.p[best].pi=0;}}
  }
  S.tick++;
}
function restartSim(S){
  const r=S.rs;S.rs=null;const b=S.b;
  if(r.type==='goal'){kickoffSim(S,r.team);return;}
  let tk=-1;
  if(r.type==='arco'){tk=r.team?5:0;S.gk={team:r.team};
    for(let j=0;j<10;j++){if(team(j)===r.team)continue;const q=S.p[j];if(inArea(r.team,q.x,q.y)){q.path=null;q.pi=0;const ex=r.team?FW-17:17;const dx=Math.abs(q.x-(r.team?FW-16.5:16.5)),dy=Math.min(Math.abs(q.y-(CY-20.16)),Math.abs(q.y-(CY+20.16)));if(dx<dy)q.x=ex;else q.y=q.y<CY?CY-20.7:CY+20.7;}}}
  else{let bd=1e9;for(let i=0;i<10;i++){if(team(i)!==r.team||isK(i))continue;const P=S.p[i],dx=P.x-r.x,dy=P.y-r.y,d=dx*dx+dy*dy;if(d<bd){bd=d;tk=i;}}}
  if(r.type!=='arco')S.gk=null;S.ko=null;
  const P=S.p[tk];P.x=r.x;P.y=r.y;P.path=null;P.pi=0;
  Object.assign(b,{x:r.x,y:r.y,vx:0,vy:0,o:tk,lk:-1,lkT:0,lt:r.team});
}
/* =================== IA (rival de la PC, o equipo sin humanos en el online) =================== */
const aiHold={};
function aiThink(S,t){
  const acts=[],b=S.b,dir=t?-1:1,gx=t?0:FW,mine=[],opp=[];for(let i=0;i<10;i++)(team(i)===t?mine:opp).push(i);
  const P=S.p,dist=(a,b2)=>sq((a.x-b2.x)**2+(a.y-b2.y)**2);
  const goTo=(i,x,y)=>{x=clamp(x,1,FW-1);y=clamp(y,1,FH-1);const q=P[i],end=q.path?q.path[q.path.length-1]:[q.x,q.y];
    if(sq((end[0]-x)**2+(end[1]-y)**2)>1.6&&sq((q.x-x)**2+(q.y-y)**2)>0.8)acts.push({k:'m',i,path:[[x,y]]});};
  const keeperSpot=k=>{const gxk=t?FW:0,bx=b.x-gxk,by=b.y-CY,l=sq(bx*bx+by*by)||1,dd=Math.min(5,1.5+l*0.05);return[gxk+bx/l*dd,CY+by/l*dd*0.8];};
  if(S.rs){aiHold[t]=0;return acts;}
  const carrier=b.o>=0&&team(b.o)===t?b.o:-1;
  if(carrier>=0){
    aiHold[t]=(aiHold[t]||0)+30;const c=P[carrier];
    if(aiHold[t]>=60+((S.tick/30|0)%3)*20){
      const dg=sq((gx-c.x)**2+(CY-c.y)**2);
      const lane=(m)=>{let mn=99;for(const o of opp){const q=P[o],ex=m.x-c.x,ey=m.y-c.y,L2=ex*ex+ey*ey||1,u=clamp(((q.x-c.x)*ex+(q.y-c.y)*ey)/L2,0,1);
        mn=Math.min(mn,sq((q.x-(c.x+ex*u))**2+(q.y-(c.y+ey*u))**2)+(u<0.05?3:0));}return mn;};
      if(dg<30&&!isK(carrier)){const k=P[t?0:5],side=k.y>CY?-1:1;acts.push({k:'p',i:carrier,tx:gx+dir*2,ty:CY+side*(PO-0.7),pw:1});aiHold[t]=0;}
      else{let best=-1,bs=-1e9;
        for(const m of mine){if(m===carrier)continue;const q=P[m],d=dist(q,c);if(d<5||d>45)continue;const s=lane(q)*1.4+(q.x-c.x)*dir*0.25-(isK(m)?8:0);if(s>bs){bs=s;best=m;}}
        if(best>=0){const q=P[best],d=dist(q,c),v=sq(2*AB*(d+2.5));acts.push({k:'p',i:carrier,tx:q.x,ty:q.y,pw:clamp((v-VMIN)/(VMAX*S.cfg.pm-VMIN),0,1)});aiHold[t]=0;}}
    }
    for(const m of mine){if(m===carrier)continue;const q=P[m];
      if(isK(m)){const s=keeperSpot(m);goTo(m,s[0],s[1]);continue;}
      const f=FORM[m%5],att=m%5>=3,lat=(f[1]-CY)*(att?0.9:0.8);
      goTo(m,c.x+dir*(att?14:-6),CY+lat+(((S.tick/120|0)+m)%2?3:-3));}
  }else{
    aiHold[t]=0;
    const carrierO=b.o>=0?b.o:-1;
    let chaser=-1;
    if(carrierO<0){let bd=1e9;for(const m of mine){if(isK(m))continue;const q=P[m],px=b.x+b.vx*0.7,py=b.y+b.vy*0.7,d=sq((q.x-px)**2+(q.y-py)**2);if(d<bd){bd=d;chaser=m;}}
      if(chaser>=0)goTo(chaser,b.x+b.vx*0.7,b.y+b.vy*0.7);}
    // marcar: cada uno toma al rival libre más cercano, entre él y la pelota
    const free=opp.filter(o=>o!==carrierO&&!isK(o)),used={};
    for(const m of mine){if(m===chaser)continue;const q=P[m];
      if(isK(m)){const s=keeperSpot(m);goTo(m,s[0],s[1]);continue;}
      let best=-1,bd=1e9;for(const o of free){if(used[o])continue;const d=dist(P[o],q);if(d<bd){bd=d;best=o;}}
      if(best>=0){used[best]=1;const o=P[best],ex=b.x-o.x,ey=b.y-o.y,l=sq(ex*ex+ey*ey)||1,k=carrierO>=0?Math.min(4.5,l*0.35):2;goTo(m,o.x+ex/l*k,o.y+ey/l*k);}
      else{const f=formPos(m,false);goTo(m,(f[0]+b.x)/2,f[1]);}}
  }
  return acts;
}
/* =================== JUEGO: reloj, eventos y rebobinado =================== */
const G={S:newState(0),events:[],hist:new Map(),t0:performance.now(),mode:'pc',myTeam:0,human:[true,false],lastAI:0,actN:0,lastRsN:0,lastSc:'0-0',lastKc:1};
G.hist.set(0,cloneS(G.S));
function evCmp(a,b){return a.tick-b.tick||(a.id<b.id?-1:a.id>b.id?1:0);}
function insertEvent(ev){
  const k=G.events.findIndex(e=>e.id===ev.id);let rb=ev.tick;
  if(k>=0){if(G.events[k].tick===ev.tick&&JSON.stringify(G.events[k].a)===JSON.stringify(ev.a))return;rb=Math.min(rb,G.events[k].tick);G.events.splice(k,1);}
  G.events.push(ev);G.events.sort(evCmp);
  if(rb<G.S.tick)rollback(rb);
}
function rollback(t){
  let tt=t;while(tt>=0&&!G.hist.has(tt))tt--;if(tt<0)return;
  if(G.S.tick-tt>400)return;
  G.S=cloneS(G.hist.get(tt));for(const k of [...G.hist.keys()])if(k>tt)G.hist.delete(k);
}
function advanceTo(T){
  let n=0;
  while(G.S.tick<T&&n<240){const tk=G.S.tick;for(const e of G.events)if(e.tick===tk)applyAct(G.S,e.a);stepSim(G.S);G.hist.set(G.S.tick,cloneS(G.S));G.hist.delete(G.S.tick-420);n++;}
  if(G.events.length>600)G.events=G.events.filter(e=>e.tick>G.S.tick-420);
}
function targetTick(){
  if(G.mode==='online'&&!NET.host){if(NET.off===null)return G.S.tick;return Math.floor((performance.now()-NET.off-NET.hT0)/(DT*1000));}
  return Math.floor((performance.now()-G.t0)/(DT*1000));
}
function act(a){   // una acción del usuario o de la IA
  const id=(NET.me||'local')+':'+(++G.actN);
  if(G.mode!=='online'){insertEvent({id,tick:G.S.tick+1,a});return;}
  if(NET.host){const ev={id,tick:G.S.tick+5,a};insertEvent(ev);netSend({ty:'ev',ev});}
  else{const tick=G.S.tick+12;insertEvent({id,tick,a,pred:true});netSend({ty:'in',id,tick,a});}
}
function newGame(kt){G.S=newState(kt||0);G.events=[];G.hist=new Map();G.hist.set(0,cloneS(G.S));G.t0=performance.now();G.lastRsN=0;G.lastSc='0-0';G.lastKc=G.S.kc;passMode=false;drag=null;hold=null;}
/* =================== ONLINE =================== */
const NET={room:null,kind:'',on:false,host:true,me:'',team:0,peers:[],off:null,hT0:0,code:'',status:'',ob:[],obN:0,seen:{},lastHb:0,lastSnap:0,lastAI:0,synced:false};
const MQTT_BROKERS=window.__BROKERS||['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
function mqttRoom(code,onStatus,opts){
  opts=opts||{};
  const me='p'+Math.random().toString(36).slice(2,10),base='partidito/v1/'+code+'/';
  const enc=new TextEncoder(),dec=new TextDecoder();
  let streams=[],ws=null,ok=false,myPres={},others={},subs=[],lastSend=0,pendT=null,bi=0,ping=null,closed=false;
  const str=s=>{const b=enc.encode(s);return[b.length>>8,b.length&255,...b];};
  const varlen=n=>{const o=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;o.push(d);}while(n>0);return o;};
  const pkt=(h,body)=>new Uint8Array([h,...varlen(body.length),...body]);
  function send(u8){if(ws&&ws.readyState===1)ws.send(u8);}
  function publish(topic,obj){const t=str(topic),p=enc.encode(JSON.stringify(obj));const body=new Uint8Array(t.length+p.length);body.set(t,0);body.set(p,t.length);
    send(new Uint8Array([0x30,...varlen(body.length),...body]));}
  function list(){const now=Date.now(),ps=[{peer:me,by:null,isMe:true,sameTab:true,kind:'viewer',guest:false,presence:myPres,updatedAt:now}];
    for(const id in others)ps.push({peer:id,by:null,isMe:false,sameTab:false,kind:'viewer',guest:false,presence:others[id].p,updatedAt:others[id].t});return ps;}
  function fire(){const ps=list();room._ps=ps;for(const f of subs)try{f({peers:ps,joined:[],left:[],updated:[]});}catch(e){}}
  function flush(){if(opts.silent)return;pendT=null;lastSend=performance.now();publish(base+'p/'+me,{id:me,p:myPres});}
  let buf=new Uint8Array(0);
  function onData(u8){const nb=new Uint8Array(buf.length+u8.length);nb.set(buf);nb.set(u8,buf.length);buf=nb;
    while(buf.length>=2){let mul=1,len=0,i=1,b;do{if(i>=buf.length)return;b=buf[i++];len+=(b&127)*mul;mul*=128;}while(b&128);
      if(buf.length<i+len)return;const type=buf[0]>>4,body=buf.slice(i,i+len);buf=buf.slice(i+len);
      if(type===2){ok=true;send(pkt(0x82,[0,1,...str(base+'p/+'),0]));send(pkt(0x82,[0,2,...str(base+'s/+'),0]));flush();onStatus&&onStatus('ok');}
      else if(type===3){const tl=(body[0]<<8)|body[1],topic=dec.decode(body.slice(2,2+tl)),payload=dec.decode(body.slice(2+tl));
        if(topic.indexOf('/s/')>=0){try{const m=JSON.parse(payload);if(m&&typeof m.id==='string'&&m.id!==me&&others[m.id])for(const f of streams)try{f(m.id,m.d);}catch(e){}}catch(e){}continue;}
        try{const m=JSON.parse(payload);if(m&&typeof m.id==='string'&&m.id!==me&&m.id.length<20){if(m.bye){delete others[m.id];}else if(m.p&&typeof m.p==='object'){const isNew=!others[m.id];others[m.id]={p:m.p,t:Date.now()};if(isNew)flush();}fire();}}catch(e){}}}}
  function connect(){
    if(closed)return;const url=MQTT_BROKERS[bi%MQTT_BROKERS.length];bi++;
    try{ws=new WebSocket(url,'mqtt');}catch(e){setTimeout(connect,1500);return;}
    ws.binaryType='arraybuffer';buf=new Uint8Array(0);
    const to=setTimeout(()=>{if(!ok){try{ws.close();}catch(e){}}},6000);

function up(e){
  if(drag&&e.pointerId===drag.id){const d=drag;drag=null;if(d.pts.length>1&&e.type==='pointerup')act({k:'m',i:d.i,path:d.pts.slice(1,61)});}
  if(tap&&e.pointerId===tap.id){const t=tap;tap=null;if(Math.hypot(e.clientX-t.x,e.clientY-t.y)<14){passMode=t.cancel?false:true;if(passMode)snd(600,800,0.05,0.06);}}
  if(hold&&e.pointerId===hold.id){const h=hold,pw=Math.round(holdPower()*100)/100;hold=null;if(e.type==='pointerup'){const b=G.S.b;
      if(b.o>=0&&team(b.o)===G.myTeam){act({k:'p',i:b.o,tx:Math.round(h.f.x*10)/10,ty:Math.round(h.f.y*10)/10,pw});snd(140,60,0.3+pw*0.4,0.12);}passMode=false;}}
}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
/* =================== PANEL ONLINE =================== */
let lobbyWait=false;
const pel=document.getElementById('panel'),pbox=document.getElementById('pbox');
function panel(){
  const B=(id,t,bg,fg)=>`<button id="${id}" style="background:${bg};color:${fg||'#fff'}">${t}</button>`;
  let h='<h2 style="margin:0 0 8px">👥 Jugar online</h2>';
  if(G.mode==='online'){const c0=joined().filter(p=>p.presence.mp.team===0).length,c1=joined().filter(p=>p.presence.mp.team===1).length;
    h+=`<p>${NET.kind==='mqtt'?(NET.open?'':'Sala <b>'+NET.code+'</b> · ')+NET.status+'<br>':''}Jugás con <b style="color:${NET.team?'#ff7a70':'#6cb4ee'}">${NET.team?'ROJO':'CELESTE'}</b>${NET.host?' (tu teléfono lleva el reloj del partido)':''}.<br>Celeste: ${c0} · Rojo: ${c1}. Un equipo sin personas lo juega la PC.</p>`;
    if(NET.kind==='mqtt'&&NET.open)h+='<p style="color:#8dff9f">Sala abierta: cualquiera que entre a Partidito la ve y puede entrar.</p>';
    else if(NET.kind==='mqtt')h+=B('cp','📋 Copiar link para invitar','#2b5d8a')+'<p id="cpm" style="margin:0;color:#8dff9f;font-size:13px;min-height:16px"></p>';
    h+=B('lv','Volver a jugar contra la PC','#6b2a2a');}
  else if(NET.claudeRoom){h+='<p>Los que tengan el juego abierto con su cuenta de Claude entran al mismo partido. Elegí equipo; los del mismo equipo comparten los jugadores.</p>'+B('j0','Jugar con CELESTE','#6cb4ee','#0a2440')+B('j1','Jugar con ROJO','#d93a32');}
  else if(window.claude){h+='<p>En esta vista de Claude el online no está disponible. Usá la versión de GitHub para jugar con código de sala.</p>';}
  else{const def=(location.hash||'').replace('#','')||NET.code||('sala-'+Math.random().toString(36).slice(2,6));
    h+=B('qk','⚡ Partida rápida','#2e8a4a')+'<p style="margin:10px 0 4px;color:#fff"><b>Salas abiertas</b></p><div id="lob"><p style="font-size:13px">Buscando…</p></div>'
      +B('mk','➕ Crear sala abierta','#2b5d8a')
      +'<details style="margin-top:10px"'+((location.hash||'').length>2?' open':'')+'><summary style="color:#aaa">Sala privada con código</summary><input id="code" maxlength="24" value="'+def+'">'
      +B('cp','📋 Copiar link para invitar','#3a3a3a')+'<p id="cpm" style="margin:0;color:#8dff9f;font-size:13px;min-height:16px"></p>'+B('j0','Entrar con CELESTE','#6cb4ee','#0a2440')+B('j1','Entrar con ROJO','#d93a32')+'</details>';}
  h+=B('x','Cerrar','#444');pbox.innerHTML=h;pel.style.display='flex';
  const on=(id,f)=>{const el=document.getElementById(id);if(el)el.onclick=f;};
  const code=()=>{const i=document.getElementById('code');return(i?i.value:NET.code).toLowerCase().replace(/[^a-z0-9-]/g,'');};
  const close=()=>{pel.style.display='none';lobbyClose();};
  on('x',close);
  on('cp',()=>{const l=location.origin+location.pathname+'#'+code(),m=document.getElementById('cpm');try{navigator.clipboard.writeText(l).then(()=>m.textContent='Copiado: '+l,()=>m.textContent=l);}catch(e){m.textContent=l;}});
  const join=(t,c,open)=>{close();netConnect(c||code(),open);let n=0;const tr=()=>{if(NET.room&&(NET.kind==='claude'||NET.room.connected())){netJoin(t);}else if(n++<30)setTimeout(tr,400);else banner('No se pudo conectar',1600);};tr();};
  on('j0',()=>join(0));on('j1',()=>join(1));on('lv',()=>{close();netLeave();});
  const fresh=lobbyRooms;
  const freeTeam=o=>o.c1<=o.c0?1:0;
  const newOpen=()=>join(0,'sala-'+Math.random().toString(36).slice(2,8),true);
  on('mk',newOpen);
  on('qk',()=>{const r=fresh();if(r.length)join(freeTeam(r[0]),r[0].code,true);else{lobbyWait=true;const m=document.getElementById('lob');if(m)m.innerHTML='<p style="font-size:13px">Buscando sala…</p>';setTimeout(()=>{if(!lobbyWait)return;lobbyWait=false;const r2=fresh();if(r2.length)join(freeTeam(r2[0]),r2[0].code,true);else newOpen();},2500);}});
  const who=n=>n?n+(n>1?' personas':' persona'):'PC';
  const render=()=>{const el=document.getElementById('lob');if(!el)return;const r=fresh();
    if(!r.length){el.innerHTML='<p style="font-size:13px">No hay salas abiertas ahora. Creá una y esperá a que entre alguien (mientras, jugás contra la PC).</p>';return;}
    el.innerHTML=r.slice(0,6).map((o,k)=>'<div style="display:flex;align-items:center;gap:8px;margin:4px 0"><span style="flex:1;font-size:13px;text-align:left"><b style="color:#6cb4ee">Celeste</b> '+who(o.c0)+' · <b style="color:#ff7a70">Rojo</b> '+who(o.c1)+'<br>Va '+String(o.sc).replace(/[^0-9-]/g,'')+'</span><button data-k="'+k+'" style="width:auto;margin:0;padding:8px 14px;background:'+(freeTeam(o)?'#d93a32':'#6cb4ee')+';color:'+(freeTeam(o)?'#fff':'#0a2440')+'">Entrar</button></div>').join('');
    el.querySelectorAll('button').forEach(b=>b.onclick=()=>{const o=r[+b.dataset.k];join(freeTeam(o),o.code,true);});
    if(lobbyWait&&r.length){lobbyWait=false;join(freeTeam(r[0]),r[0].code,true);}};
  if(document.getElementById('lob')){lobbyOpen(render);setTimeout(render,2500);}
}
function settings(){
  const c=G.S.cfg;
  const row=(id,label,min,max,step,val,fmt)=>`<p style="margin:14px 0 4px;color:#fff">${label}: <b id="${id}v">${fmt(val)}</b></p><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${val}" style="width:100%;padding:0">`;
  pbox.innerHTML='<h2 style="margin:0 0 6px">⚙ Ajustes</h2>'
    +row('bl','Distancia de marca del rival',2,10,0.5,c.bl,v=>(+v).toFixed(1)+' m')
    +'<p style="margin:2px 0 0;font-size:13px">Hasta dónde se puede acercar el rival al que tiene la pelota (el círculo punteado).</p>'
    +row('pm','Potencia máxima del pase',60,140,5,Math.round(c.pm*100),v=>v+'%')
    +row('ch','Tiempo para llegar a la potencia máxima',0.4,2.5,0.1,CFG.ch,v=>(+v).toFixed(1)+' s')
    +'<p style="margin:2px 0 0;font-size:13px">Más tiempo = más fácil dosificar pases suaves. Los dos primeros ajustes valen para todos los del partido online; el tiempo de carga es solo tuyo.</p>'
    +'<button id="ok" style="background:#2e8a4a;color:#fff">Listo</button>';
  pel.style.display='flex';
  const g=id=>document.getElementById(id);
  for(const [id,fmt] of [['bl',v=>(+v).toFixed(1)+' m'],['pm',v=>v+'%'],['ch',v=>(+v).toFixed(1)+' s']])g(id).oninput=()=>{g(id+'v').textContent=fmt(g(id).value);};
  g('ok').onclick=()=>{const bl=+g('bl').value,pm=+g('pm').value/100;CFG.ch=+g('ch').value;CFG.bl=bl;CFG.pm=pm;
    try{localStorage.setItem('pt_cfg',JSON.stringify(CFG));}catch(e){}
    if(bl!==G.S.cfg.bl||pm!==G.S.cfg.pm)act({k:'c',bl,pm});pel.style.display='none';banner('Ajustes guardados',900);};
}
pel.addEventListener('pointerdown',e=>e.stopPropagation());
/* =================== BUCLE =================== */
function frame(now){
  if(!(G.mode==='online'&&!NET.host&&!NET.synced)){
    const T=targetTick();if(T>G.S.tick+300)G.S.tick=T-1;advanceTo(T);
    // IA: equipos sin humanos (en el anfitrión o contra la PC)
    if((G.mode==='pc'||NET.host)&&G.S.tick-G.lastAI>=30){G.lastAI=G.S.tick;for(const t of [0,1])if(!G.human[t])for(const a of aiThink(G.S,t))act(a);}
  }
  netTick();
  // efectos según cambios del partido
  const S=G.S,sc=S.sc.join('-');
  if(sc!==G.lastSc){const [a,c]=G.lastSc.split('-').map(Number);if(S.sc[0]>a||S.sc[1]>c){const t=S.sc[0]>a?0:1;banner(t===G.myTeam?'¡GOOOL!':'Gol rival',1900,true);snd(500,900,0.15,0.6,'sawtooth');}G.lastSc=sc;}
  if(S.rsN!==G.lastRsN){G.lastRsN=S.rsN;if(S.rs&&S.rs.type!=='goal'){banner({lateral:'Lateral',corner:'¡Córner!',arco:'Saque de arco'}[S.rs.type],1300);snd(2900,2700,0.05,0.2,'square');}}
  if(passMode&&!(S.b.o>=0&&team(S.b.o)===G.myTeam))passMode=false;
  if(drag&&S.b.o===drag.i)drag=null;
  draw(now);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setTimeout(()=>{if(!window.claude&&(location.hash||'').length>2)panel();},900);
window.__T={blocked,advanceTo,aiThink,G,NET,act,newGame,toS,toF,joined,netConnect,netJoin,panel,lobbyRooms};
})();
</script>
