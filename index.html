let AC=null,crowdG=null,crowdCur=0,crowdT=0;
function initAudio(){
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const len=AC.sampleRate*3,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);let b=0;
    for(let i=0;i<len;i++){b=0.985*b+0.015*(Math.random()*2-1);d[i]=b*6+(Math.random()*2-1)*0.08;}
    const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
    const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=600;bp.Q.value=0.45;
    crowdG=AC.createGain();crowdG.gain.value=0;src.connect(bp).connect(crowdG).connect(AC.destination);src.start();
  }catch(e){AC=null}
}
function crowdTo(v,t){
  if(SIM||!crowdG||Math.abs(v-crowdCur)<0.008)return;crowdCur=v;
  try{const n=AC.currentTime;crowdG.gain.cancelScheduledValues(n);crowdG.gain.setValueAtTime(crowdG.gain.value,n);crowdG.gain.linearRampToValueAtTime(v,n+t);}catch(_){}
}
function tone(type,freq,f2,vol,dur){
  if(!AC||SIM)return;try{
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
    g.gain.setValueAtTime(Math.min(vol,1),t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+0.02);
  }catch(e){}
}
function noise(vol,dur,freq,type){
  if(!AC||SIM)return;try{
    const t=AC.currentTime,n=AC.createBufferSource(),buf=AC.createBuffer(1,Math.max(1,AC.sampleRate*dur|0),AC.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
    const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq||1200;
    const g=AC.createGain();g.gain.value=Math.min(vol,1);n.buffer=buf;n.connect(f).connect(g).connect(AC.destination);n.start(t);
  }catch(e){}
}
const sKick=p=>{tone('sine',120+p*40,50,0.25+p*0.6,0.13);noise(0.2+p*0.5,0.05,2500);};

const sNet=v=>{noise(Math.min(0.4,v*0.04),0.3,3500,'highpass');};
const sGlove=v=>{tone('sine',240,90,Math.min(0.5,0.15+v*0.02),0.09);noise(0.2,0.04,1800);};
const sBounce=v=>{tone('sine',90,50,Math.min(0.3,v*0.04),0.07);};
const sBoard=v=>{tone('square',160,80,Math.min(0.25,v*0.02),0.08);noise(Math.min(0.3,v*0.03),0.06,900);};

/* ======================= ONLINE (room) ======================= */
/* ---------- online sin cuentas: sala por código sobre un servidor MQTT público ---------- */
const MQTT_BROKERS=window.__BROKERS||['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
function mqttRoom(code,onStatus){
  const me='p'+Math.random().toString(36).slice(2,10),base='partidito/v1/'+code+'/';
  const enc=new TextEncoder(),dec=new TextDecoder();
  let streams=[],ws=null,ok=false,myPres={},others={},subs=[],lastSend=0,pendT=null,bi=0,ping=null,closed=false;
  const str=s=>{const b=enc.encode(s);return[b.length>>8,b.length&255,...b];};
  const varlen=n=>{const o=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;o.push(d);}while(n>0);return o;};
  const pkt=(h,body)=>new Uint8Array([h,...varlen(body.length),...body]);
  function send(u8){if(ws&&ws.readyState===1)ws.send(u8);}
  function publish(topic,obj){const t=str(topic),p=enc.encode(JSON.stringify(obj));const body=new Uint8Array(t.length+p.length);body.set(t,0);body.set(p,t.length);
    send(new Uint8Array([0x30,...varlen(body.length),...body]));}
  function list(){const now=Date.now(),ps=[{peer:me,by:null,isMe:true,sameTab:true,kind:'viewer',guest:false,presence:myPres,updatedAt:now}];
    for(const id in others)ps.push({peer:id,by:null,isMe:false,sameTab:false,kind:'viewer',guest:false,presence:others[id].p,updatedAt:others[id].t});return ps;}
  function fire(){const ps=list();room._ps=ps;for(const f of subs)try{f({peers:ps,joined:[],left:[],updated:[]});}catch(e){}}
  function flush(){pendT=null;lastSend=performance.now();publish(base+'p/'+me,{id:me,p:myPres});}
  let buf=new Uint8Array(0);
  function onData(u8){const nb=new Uint8Array(buf.length+u8.length);nb.set(buf);nb.set(u8,buf.length);buf=nb;
    while(buf.length>=2){let mul=1,len=0,i=1,b;do{if(i>=buf.length)return;b=buf[i++];len+=(b&127)*mul;mul*=128;}while(b&128);
      if(buf.length<i+len)return;const type=buf[0]>>4,body=buf.slice(i,i+len);buf=buf.slice(i+len);
      if(type===2){ok=true;send(pkt(0x82,[0,1,...str(base+'p/+'),0]));send(pkt(0x82,[0,2,...str(base+'s/+'),0]));flush();onStatus&&onStatus('ok');}
      else if(type===3){const tl=(body[0]<<8)|body[1],topic=dec.decode(body.slice(2,2+tl)),payload=dec.decode(body.slice(2+tl));
        if(topic.indexOf('/s/')>=0){try{const m=JSON.parse(payload);if(m&&typeof m.id==='string'&&m.id!==me&&others[m.id])for(const f of streams)try{f(m.id,m.d);}catch(e){}}catch(e){}continue;}
        try{const m=JSON.parse(payload);if(m&&typeof m.id==='string'&&m.id!==me&&m.id.length<20){if(m.bye){delete others[m.id];}else if(m.p&&typeof m.p==='object'){const isNew=!others[m.id];others[m.id]={p:m.p,t:Date.now()};if(isNew)flush();}fire();}}catch(e){}}}}
  function connect(){
    if(closed)return;const url=MQTT_BROKERS[bi%MQTT_BROKERS.length];bi++;
    try{ws=new WebSocket(url,'mqtt');}catch(e){setTimeout(connect,1500);return;}
    ws.binaryType='arraybuffer';buf=new Uint8Array(0);
    const to=setTimeout(()=>{if(!ok){try{ws.close();}catch(e){}}},6000);
    ws.onopen=()=>{const body=[...str('MQTT'),4,0x02,0,60,...str(me)];send(pkt(0x10,body));};
    ws.onmessage=e=>onData(new Uint8Array(e.data));
    ws.onclose=()=>{clearTimeout(to);ok=false;onStatus&&onStatus('reconnect');if(!closed)setTimeout(connect,1200);};
    ws.onerror=()=>{};
  }
  ping=setInterval(()=>{send(new Uint8Array([0xC0,0]));const now=Date.now();let ch=false;for(const id in others)if(now-others[id].t>4000){delete others[id];ch=true;}if(ch)fire();if(ok)flush();},1000);
  const room={code,
    presence(patch){myPres={...myPres};for(const k in patch){if(patch[k]===null)delete myPres[k];else myPres[k]=patch[k];}
      const now=performance.now();if(now-lastSend>45)flush();else if(!pendT)pendT=setTimeout(flush,45-(now-lastSend));fire();return Promise.resolve();},
    onPeers(f){subs.push(f);setTimeout(fire,0);return()=>{subs=subs.filter(x=>x!==f);};},
    send(d){publish(base+'s/'+me,{id:me,d});},onStream(f){streams.push(f);},
    peers(){return room._ps||list();},connected(){return ok;},
    leave(){closed=true;try{publish(base+'p/'+me,{id:me,bye:1});}catch(e){}clearInterval(ping);setTimeout(()=>{try{ws.close();}catch(e){}},200);}};
  connect();return room;
}

const NET={kind:'',code:'',status:'',on:false,avail:false,room:null,host:true,slot:-1,team:0,peers:[],world:null,wAt:0,kickN:0,cmdN:0,seenK:{},seenC:{},pend:{},lastMe:0,lastW:0,wN:0,ko:0,seenKo:-1,lastSc:null};
const r2=v=>Math.round(v*100)/100,fin=(v,a,b)=>typeof v==='number'&&isFinite(v)?clamp(v,a,b):null;
function allEnts(){return[players[0],players[1],players[2],players[3],keepers[0],players[4],players[5],players[6],players[7],keepers[1]];}
function slotOf(e){return allEnts().indexOf(e);}
function ent(s){return allEnts()[s];}
function myTeam(){return NET.on?NET.team:0;}
function claimsMap(){const m={};for(const p of NET.peers){const mp=p.presence&&p.presence.mp;if(!mp||typeof mp.slot!=='number')continue;const sl=mp.slot|0;if(sl<0||sl>9)continue;if(!m[sl]||p.peer<m[sl].peer)m[sl]=p;}return m;}
function canTake(e){if(!NET.on)return true;const c=claimsMap()[slotOf(e)];return!c||c.sameTab;}
function joinedPeers(){return NET.peers.filter(p=>p.presence&&p.presence.mp&&typeof p.presence.mp.slot==='number');}
function teamCount(t){return joinedPeers().filter(p=>p.presence.mp.team===t).length;}
(async()=>{try{const r=window.claude&&window.claude.use?await window.claude.use('room'):null;if(!r)return;NET.room=r;NET.avail=true;NET.kind='claude';
  r.onPeers(ch=>{NET.peers=ch.peers;netRecalc();});}catch(e){}})();
function freeSlot(team){const c=claimsMap(),order=team?[7,8,5,6,9]:[2,3,0,1,4];for(const s of order)if(!c[s]||c[s].sameTab)return s;return-1;}
function netConnectCode(code){
  code=(code||'').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,24)||('sala-'+Math.random().toString(36).slice(2,6));
  if(NET.room&&NET.kind==='mqtt'&&NET.code===code)return;
  if(NET.room&&NET.kind==='mqtt')NET.room.leave();
  NET.code=code;NET.kind='mqtt';NET.status='Conectando…';NET.peers=[];
  NET.room=mqttRoom(code,st=>{NET.status=st==='ok'?'Conectado':'Reconectando…';const el=document.getElementById('netst');if(el)el.textContent=NET.status;});
  NET.room.onPeers(ch=>{NET.peers=ch.peers;netRecalc();});NET.room.onStream(onStream);NET.snaps=[];NET.off=null;
  try{history.replaceState(null,'','#'+code);}catch(e){}
}
function netJoin(team){
  if(!NET.room)return;const s=freeSlot(team);if(s<0){showBanner('Ese equipo está lleno',1200,'mid');return;}
  NET.on=true;NET.team=team;NET.slot=s;P=ent(s);P.cmd=null;cam.yaw=team?Math.PI:0;
  NET.room.presence({mp:{team,slot:s},me:null,w:null,k:null,c:null}).catch(()=>{});netRecalc();
  showBanner(team?'Jugás en ROJO':'Jugás en CELESTE',1200,'mid');
}
function netLeave(){if(NET.room)NET.room.presence({mp:null,me:null,w:null,k:null,c:null}).catch(()=>{});if(NET.kind==='mqtt'){const r=NET.room;setTimeout(()=>r.leave(),300);NET.room=null;NET.peers=[];}NET.on=false;NET.host=true;for(const e of allEnts())e.remote=false;P=players[2];}
function netClaim(e){NET.slot=slotOf(e);if(NET.room)NET.room.presence({mp:{team:NET.team,slot:NET.slot}}).catch(()=>{});}
function netRecalc(){
  if(!NET.on){NET.host=true;return;}
  const jp=joinedPeers();let host=null;for(const p of jp)if(!host||p.peer<host.peer)host=p;
  const wasHost=NET.host;NET.host=!host||host.sameTab;NET.hostPeer=host;
  const c=claimsMap();
  for(let s=0;s<10;s++){const e=ent(s);e.remote=!!(c[s]&&!c[s].sameTab);}
  if(NET.slot>=0&&c[NET.slot]&&!c[NET.slot].sameTab){const s=freeSlot(NET.team);if(s>=0){NET.slot=s;P=ent(s);netClaim(P);}}
  if(NET.host&&!wasHost){const w=NET.snaps.length?NET.snaps[NET.snaps.length-1]:NET.world;if(w)applyWorld(w,1,true);}
  if(!NET.host&&wasHost){NET.snaps=[];NET.off=null;}
}
/* ---- canal rápido: entradas de los clientes y foto del mundo del anfitrión ---- */
NET.inputs={};NET.snaps=[];NET.off=null;NET.delay=0.11;NET.claimAt=0;NET.predUntil=0;NET.blend=0;
function fast(){return NET.room&&typeof NET.room.send==='function';}
function onStream(id,d){
  if(!d||typeof d!=='object')return;
  if(d.ty==='i'){NET.inputs[id]={d,at:performance.now()};}
  else if(d.ty==='w'&&NET.hostPeer&&id===NET.hostPeer.peer&&typeof d.t==='number'){
    const now=performance.now(),off=now-d.t;
    NET.off=NET.off===null?off:Math.min(off,NET.off+ (off-NET.off)*0.02+0.5); // reloj del anfitrión (con margen)
    if(off<NET.off)NET.off=off;
    const last=NET.snaps[NET.snaps.length-1];if(last&&d.t<=last.t)return;
    NET.snaps.push(d);if(NET.snaps.length>40)NET.snaps.shift();
    // demora adaptativa según el jitter
    const jit=Math.abs(off-NET.off)/1000;NET.delay=clamp(NET.delay*0.97+(0.07+jit*1.4)*0.03,0.07,0.3);
  }
}
function myInput(){
  const e=P,ks=e.isK?({dive:'d',hold:'h'}[e.state]||'r'):'r';
  const me={s:NET.slot,x:r2(e.x),y:r2(e.y),vx:r2(e.vx),vy:r2(e.vy),f:r2(e.face),ph:r2(e.armPh%62.8),ks};
  if(e.isK&&e.state==='dive')Object.assign(me,{dx:r2(e.ddx),dy:r2(e.ddy),dh:r2(e.dh),dt:r2(e.t)});
  const kl=e.legs.L,kr=e.legs.R;if(kl.kick>0)me.kl=[r2(kl.kick),kl.kt|0,r2(kl.kd||0.3)];if(kr.kick>0)me.kr=[r2(kr.kick),kr.kt|0,r2(kr.kd||0.3)];
  if(performance.now()-NET.claimAt<700)me.own=1;
  return me;
}
function netSendMe(force){
  if(!NET.on||!NET.room||NET.host&&fast())return;
  const now=performance.now();if(!force&&now-NET.lastMe<(fast()?30:33))return;NET.lastMe=now;
  const me=myInput();
  if(fast())NET.room.send({ty:'i',me,k:NET.pend.k||null,c:NET.pend.c||null});
  else NET.room.presence({me,k:NET.pend.k||null,c:NET.pend.c||null}).catch(()=>{});
}
function inputOf(p){if(fast()){const r=NET.inputs[p.peer];return r?{...r.d,at:r.at}:null;}return p.presence?{me:p.presence.me,k:p.presence.k,c:p.presence.c,at:performance.now()}:null;}
function netHostIn(dt){
  const c=claimsMap(),now=performance.now();
  for(const p of NET.peers){if(p.sameTab||!p.presence)continue;const mp=p.presence.mp;if(!mp)continue;
    const s=mp.slot|0;if(!c[s]||c[s].peer!==p.peer)continue;const e=ent(s),inp=inputOf(p);if(!inp)continue;const me=inp.me;
    if(me&&me.s===s){const x=fin(me.x,-BX,FW+BX),y=fin(me.y,-BY,FH+BY);if(x!==null&&y!==null){
      const vx=fin(me.vx,-12,12)||0,vy=fin(me.vy,-12,12)||0,age=Math.min((now-inp.at)/1000,0.15);
      if(!isFinite(e.x)||!isFinite(e.y)||Math.hypot(e.x-x,e.y-y)>6){e.x=x;e.y=y;}
      if(!(e.isK&&e.state==='hold')){const k=Math.min(1,dt*16);e.x+=(x+vx*age-e.x)*k;e.y+=(y+vy*age-e.y)*k;}

function updKeeper(k,dt){

function kickPose(t,ty){
  const sm=x=>{x=clamp(x,0,1);return x*x*(3-2*x)},C=0.38;let a1,a2,lat=0,yaw=0,lean;
  if(ty===0){a1=t<C?-0.32*sm(t/C):-0.32+0.8*sm((t-C)/0.3);if(t>0.75)a1*=1-(t-0.75)/0.25*0.8;a2=0.3;lat=Math.sin(Math.PI*Math.min(1,t/0.9))*0.9;yaw=lat*1.3;lean=0.03;}
  else{const back=[0,-0.6,-1.0,-0.7][ty],fwd=[0,1.0,1.5,0.8][ty],bend=[0,1.3,1.8,1.3][ty];
    if(t<C){const u=sm(t/C);a1=back*u;a2=0.2+bend*u;}
    else{const u=(t-C)/0.28;a1=back+(fwd-back)*sm(u);a2=Math.max(0.08,0.2+bend*(1-Math.min(1,u)*1.6));if(t>0.72){const w=(t-0.72)/0.28;a1=fwd*(1-w*0.85);a2=0.1+0.25*w;}}

function drawHuman(x,y,face,an,kit,opt){

  const bob=mv*(0.02+0.035*run)*Math.abs(Math.cos(ph)),hipH=0.95-bob-(opt.crouch||0);

  drawM(G3.box,Mx.chain(up,Mx.T(0,0.3,0),Mx.S(0.23,0.5,0.4)),shirt);

function project(x,y,z){if(!VP)return null;const p=Mx.xf(VP,x,y,z);if(p[3]<=0)return null;return{x:(p[0]+1)/2*W,y:GY+(1-p[1])/2*GHh};}
function groundAt(sx,sy,maxD){
  if(!invVP)return null;if(sy<GY)return null;const nx=sx/W*2-1,ny=1-(sy-GY)/GHh*2;
  const a=Mx.xf(invVP,nx,ny,-1),b=Mx.xf(invVP,nx,ny,1),dy=b[1]-a[1];
  if(dy>-1e-6)return null;const t=-a[1]/dy;if(t<0)return null;
  const x=a[0]+(b[0]-a[0])*t,z=a[2]+(b[2]-a[2])*t;

function liveCam(){
